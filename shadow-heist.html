<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC832">
<link rel="manifest" href="manifest.json">
<title>Shadow Heist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0a0c10;
  display:flex;justify-content:center;align-items:center;
  height:100vh;overflow:hidden;
  font-family:'Rajdhani',sans-serif;
  touch-action:none;user-select:none;
}
#wrap{
  width:min(100vw,480px);height:100vh;
  position:relative;overflow:hidden;
  background:#0a0c10;
}
canvas{display:block;width:100%;height:100%;}

/* ── HUD ── */
#hud{
  position:absolute;top:0;left:0;right:0;
  padding:14px 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:10;
}
.hud-box{
  background:rgba(10,12,16,0.85);
  border:1px solid rgba(255,200,50,0.25);
  border-radius:6px;padding:6px 12px;
  backdrop-filter:blur(4px);
}
.hud-label{font-size:10px;color:rgba(255,200,50,0.5);letter-spacing:2px;text-transform:uppercase;}
.hud-val{font-size:20px;font-weight:700;color:#FFC832;font-family:'Share Tech Mono',monospace;line-height:1.1;}

/* gadget bar */
#gadget-bar{
  position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;z-index:10;pointer-events:none;
}
.gadget-slot{
  width:52px;height:52px;
  background:rgba(10,12,16,0.9);
  border:1px solid rgba(255,200,50,0.3);
  border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:10px;color:rgba(255,200,50,0.6);letter-spacing:1px;
  position:relative;
}
.gadget-slot .g-icon{font-size:22px;line-height:1;}
.gadget-slot .g-count{
  position:absolute;top:3px;right:5px;
  font-size:11px;font-weight:700;color:#FFC832;
  font-family:'Share Tech Mono',monospace;
}
.gadget-slot.empty{opacity:0.3;}
.gadget-slot.active{border-color:#FFC832;box-shadow:0 0 10px rgba(255,200,50,0.3);}

/* alert bar */
#alert-bar{
  position:absolute;top:72px;left:50%;transform:translateX(-50%);
  background:rgba(255,50,50,0.15);
  border:1px solid rgba(255,50,50,0.4);
  border-radius:6px;padding:5px 18px;
  font-size:13px;font-weight:700;color:#FF3232;
  letter-spacing:3px;text-transform:uppercase;
  opacity:0;transition:opacity 0.3s;z-index:20;
  pointer-events:none;
}
#alert-bar.show{opacity:1;}

/* swipe hint */
#swipe-hint{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,200,50,0.35);letter-spacing:2px;
  text-transform:uppercase;pointer-events:none;z-index:10;
  text-align:center;line-height:1.6;
}

/* ── Screens ── */
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:50;
}

/* START */
#start-screen{background:linear-gradient(170deg,#0a0c10 0%,#0f1420 100%);}
.logo{text-align:center;margin-bottom:48px;}
.logo-main{
  font-size:52px;font-weight:700;color:#FFC832;
  letter-spacing:4px;line-height:1;
  text-shadow:0 0 40px rgba(255,200,50,0.3);
}
.logo-tagline{
  font-size:13px;color:rgba(255,200,50,0.4);
  letter-spacing:5px;margin-top:6px;text-transform:uppercase;
}
.start-cards{display:flex;gap:10px;margin-bottom:44px;}
.s-card{
  background:rgba(255,200,50,0.05);
  border:1px solid rgba(255,200,50,0.15);
  border-radius:8px;padding:10px 14px;
  text-align:center;font-size:11px;
  color:rgba(255,200,50,0.5);letter-spacing:1px;
}
.s-card .sc-icon{font-size:20px;margin-bottom:4px;}
.tap-to-play{
  font-size:16px;font-weight:600;color:rgba(255,200,50,0.7);
  letter-spacing:4px;text-transform:uppercase;
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* GAME OVER */
#go-screen{
  background:rgba(10,12,16,0.95);
  backdrop-filter:blur(16px);
  display:none;flex-direction:column;
}
.go-caught{
  font-size:12px;letter-spacing:5px;color:rgba(255,50,50,0.7);
  text-transform:uppercase;margin-bottom:10px;
}
.go-big{
  font-size:72px;font-weight:700;color:#FF3232;
  letter-spacing:2px;line-height:1;margin-bottom:4px;
}
.go-score{font-size:18px;color:rgba(255,200,50,0.7);letter-spacing:2px;margin-bottom:8px;}
.go-best{font-size:13px;color:rgba(255,200,50,0.4);letter-spacing:2px;margin-bottom:44px;}
.go-best.newbest{color:#FFC832;}

/* WIN */
#win-screen{
  background:rgba(10,12,16,0.95);
  backdrop-filter:blur(16px);
  display:none;flex-direction:column;
}
.win-big{
  font-size:48px;font-weight:700;color:#FFC832;
  letter-spacing:3px;margin-bottom:8px;
}
.win-sub{font-size:14px;color:rgba(255,200,50,0.5);letter-spacing:3px;margin-bottom:8px;}
.stars{font-size:36px;margin-bottom:8px;letter-spacing:4px;}
.win-score{font-size:18px;color:rgba(255,200,50,0.7);letter-spacing:2px;margin-bottom:44px;}

/* shared button */
.btn{
  background:linear-gradient(135deg,#FFC832,#e6a800);
  color:#0a0c10;border:none;
  padding:16px 52px;font-size:16px;font-weight:700;
  border-radius:50px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;letter-spacing:2px;
  text-transform:uppercase;
  box-shadow:0 8px 28px rgba(255,200,50,0.3);
  transition:transform 0.1s;margin-bottom:12px;
}
.btn:active{transform:scale(0.96);}
.btn-ghost{
  background:transparent;color:rgba(255,200,50,0.4);
  border:1px solid rgba(255,200,50,0.2);
  padding:11px 30px;font-size:13px;font-weight:600;
  border-radius:50px;cursor:pointer;
  font-family:'Rajdhani',sans-serif;letter-spacing:2px;
}

/* ── floating text ── */
.float-txt{
  position:absolute;
  font-size:16px;font-weight:700;letter-spacing:2px;
  animation:floatUp 0.9s ease-out forwards;
  pointer-events:none;z-index:30;
  font-family:'Rajdhani',sans-serif;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(0.7);}
  30%{transform:translateY(-14px) scale(1.15);}
  100%{opacity:0;transform:translateY(-70px) scale(1);}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Level</div>
      <div class="hud-val" id="h-level">01</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val" id="h-score">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Best</div>
      <div class="hud-val" id="h-best">0</div>
    </div>
  </div>

  <div id="alert-bar">⚠ DETECTED</div>

  <!-- Gadgets -->
  <div id="gadget-bar">
    <div class="gadget-slot" id="g0">
      <div class="g-icon">💨</div>
      <div style="font-size:9px;color:rgba(255,200,50,0.5);">SMOKE</div>
      <div class="g-count" id="g0-count">2</div>
    </div>
    <div class="gadget-slot" id="g1">
      <div class="g-icon">⚡</div>
      <div style="font-size:9px;color:rgba(255,200,50,0.5);">EMP</div>
      <div class="g-count" id="g1-count">1</div>
    </div>
    <div class="gadget-slot" id="g2">
      <div class="g-icon">🎯</div>
      <div style="font-size:9px;color:rgba(255,200,50,0.5);">DECOY</div>
      <div class="g-count" id="g2-count">1</div>
    </div>
  </div>

  <div id="swipe-hint">swipe to move &nbsp;·&nbsp; tap gadget to use</div>

  <!-- START SCREEN -->
  <div class="screen" id="start-screen" onclick="startGame()">
    <div class="logo">
      <div class="logo-main">SHADOW<br>HEIST</div>
      <div class="logo-tagline">Stealth Roguelite</div>
    </div>
    <div class="start-cards">
      <div class="s-card"><div class="sc-icon">👤</div>Avoid<br>Guards</div>
      <div class="s-card"><div class="sc-icon">💰</div>Steal<br>Loot</div>
      <div class="s-card"><div class="sc-icon">🚪</div>Reach<br>Exit</div>
    </div>
    <div class="tap-to-play">Tap to Begin</div>
  </div>

  <!-- GAME OVER -->
  <div class="screen" id="go-screen">
    <div class="go-caught">Caught!</div>
    <div class="go-big">BUSTED</div>
    <div class="go-score" id="go-score-val">Score: 0</div>
    <div class="go-best" id="go-best-val">Best: 0</div>
    <button class="btn" onclick="restartGame()">Try Again</button>
    <button class="btn-ghost" onclick="shareScore()">Share Score</button>
  </div>

  <!-- WIN -->
  <div class="screen" id="win-screen">
    <div class="win-big">HEIST CLEAR</div>
    <div class="win-sub" id="win-time-val"></div>
    <div class="stars" id="win-stars">★★★</div>
    <div class="win-score" id="win-score-val">Score: 0</div>
    <button class="btn" onclick="nextLevel()">Next Heist</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  SHADOW HEIST  —  Complete Prototype
// ═══════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('wrap');

// ── resize ──────────────────────────────────────────
let CW, CH;
function resize(){
  const r = canvas.getBoundingClientRect();
  CW = canvas.width  = r.width  || 375;
  CH = canvas.height = r.height || 667;
}
requestAnimationFrame(resize);
window.addEventListener('resize', resize);

// ── constants ────────────────────────────────────────
const TILE   = 40;
const COLS   = 10;
const ROWS   = 14;
const MAP_W  = COLS * TILE;
const MAP_H  = ROWS * TILE;

// ── state ────────────────────────────────────────────
let gameState = 'idle'; // idle | playing | dead | win
let level     = 1;
let score     = 0;
let best      = parseInt(localStorage.getItem('shBest') || '0');
let raf       = null;
let levelTime = 0;
let frameCount= 0;
let gadgets   = { smoke:2, emp:1, decoy:1 };
let activeGadget = null; // which gadget selected
let smokeCloudList = [];
let decoyList      = [];
let empActive      = false;
let empTimer       = 0;
let particles      = [];
let alertVisible   = false;
let alertTimer     = 0;

// ── player ───────────────────────────────────────────
const player = {
  col:1, row:1,          // grid position
  x:0,   y:0,            // pixel (animated)
  tx:0,  ty:0,           // target pixel
  moving:false,
  moving_t:0,
  detected:false,
  detectedTimer:0,
  hidden:false,           // in shadow / smoke
};

// ── guards ───────────────────────────────────────────
let guards = [];

// ── map tiles: 0=floor 1=wall 2=loot 3=exit 4=shadow-tile ──
let map = [];
let lootRemaining = 0;
let lootCollected = 0;

// ── Flood-fill connectivity check ──────────────────────
// Returns true if (tr,tc) is reachable from (sr,sc) without going through walls
function isMapConnected(sr, sc, tr, tc){
  const key = (r,c) => r*COLS+c;
  const visited = new Set();
  const queue = [{r:sr,c:sc}];
  visited.add(key(sr,sc));
  const DIRS = [[0,1],[0,-1],[1,0],[-1,0]];
  while(queue.length){
    const cur = queue.shift();
    if(cur.r===tr && cur.c===tc) return true;
    for(const [dr,dc] of DIRS){
      const nr=cur.r+dr, nc=cur.c+dc;
      if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
      if(map[nr][nc]===1) continue;
      if(visited.has(key(nr,nc))) continue;
      visited.add(key(nr,nc));
      queue.push({r:nr,c:nc});
    }
  }
  return false;
}

// ── Procedural level generation ──────────────────────
function generateLevel(lvl){
  map = [];
  for(let r=0;r<ROWS;r++){
    map[r]=[];
    for(let c=0;c<COLS;c++){
      // border walls
      if(r===0||r===ROWS-1||c===0||c===COLS-1) map[r][c]=1;
      else map[r][c]=0;
    }
  }

  // random interior walls — flood-fill check to keep map connected
  const wallCount = 8 + lvl * 2;
  let wallAttempts = 0, placedWalls = 0;
  while(placedWalls < wallCount && wallAttempts < 300){
    wallAttempts++;
    const wr = 1 + Math.floor(Math.random()*(ROWS-2));
    const wc = 1 + Math.floor(Math.random()*(COLS-2));
    if((wr===1&&wc===1)||(wr===ROWS-2&&wc===COLS-2)) continue;
    if(map[wr][wc]===1) continue;
    map[wr][wc] = 1;
    if(!isMapConnected(1,1,ROWS-2,COLS-2)){ map[wr][wc]=0; } // revert if disconnects
    else placedWalls++;
  }

  // shadow tiles
  const shadowCount = 5 + lvl;
  for(let i=0;i<shadowCount;i++){
    const sr = 1+Math.floor(Math.random()*(ROWS-2));
    const sc = 1+Math.floor(Math.random()*(COLS-2));
    if(map[sr][sc]===0) map[sr][sc]=4;
  }

  // collect all safe walkable tiles for loot placement
  const walkable = [];
  for(let r=1;r<ROWS-1;r++)
    for(let c=1;c<COLS-1;c++)
      if(map[r][c]!==1 && !(r===1&&c===1) && !(r===ROWS-2&&c===COLS-2))
        walkable.push({r,c});
  // shuffle
  for(let i=walkable.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [walkable[i],walkable[j]]=[walkable[j],walkable[i]];
  }

  // loot — pick from shuffled walkable (no infinite loop)
  lootRemaining = Math.min(2 + Math.min(lvl,4), walkable.length);
  lootCollected = 0;
  for(let i=0;i<lootRemaining;i++) map[walkable[i].r][walkable[i].c] = 2;

  // exit always clear, player start always clear
  map[ROWS-2][COLS-2] = 3;
  map[1][1] = 0;
}

// ── Guard factory ────────────────────────────────────
function makeGuard(col, row, patrolPath, fovAngle, fovRange){
  return {
    col, row,
    x: col*TILE + TILE/2,
    y: row*TILE + TILE/2,
    patrolPath,      // [{col,row}, ...]
    patrolIdx: 0,
    patrolDir: 1,
    angle: 0,        // facing angle in radians
    targetAngle: 0,
    fovAngle: fovAngle || Math.PI*0.45,
    fovRange: fovRange || 3.5,
    moving: false,
    moveT: 0,
    frozenTimer: 0,  // EMP freeze
    alertTimer: 0,
    spotted: false,
    moveInterval: Math.floor(50 + Math.random()*20),
    moveTick: 0,
  };
}

function spawnGuards(lvl){
  guards = [];
  const count = 1 + Math.floor(lvl * 0.7);

  // Collect walkable non-player-start tiles for patrol waypoints
  const walkable = [];
  for(let r=1;r<ROWS-1;r++)
    for(let c=1;c<COLS-1;c++)
      if(map[r][c]!==1 && !(r===1&&c===1))
        walkable.push({col:c,row:r});

  // Shuffle walkable pool
  for(let i=walkable.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [walkable[i],walkable[j]]=[walkable[j],walkable[i]];
  }

  // Each guard gets 2-3 random walkable waypoints guaranteed wall-free
  const waypointsPerGuard = 3;
  for(let i=0;i<count;i++){
    const startIdx = i * waypointsPerGuard;
    if(startIdx >= walkable.length) break;
    const path = walkable.slice(startIdx, startIdx + waypointsPerGuard);
    if(path.length < 2) break;
    const start = path[0];
    guards.push(makeGuard(
      start.col, start.row, path,
      Math.PI*0.40 + lvl*0.03,
      3 + lvl*0.3
    ));
  }
}


// ── Map offset (center map on canvas) ───────────────
function mapOffset(){
  return {
    ox: Math.round((CW - MAP_W) / 2),
    oy: Math.round((CH - MAP_H) / 2) + 20,
  };
}

// ── Draw ─────────────────────────────────────────────
const FLOOR_CLR  = '#10141c';
const WALL_CLR   = '#1e2430';
const SHADOW_CLR = '#0c1018';
const GRID_CLR   = 'rgba(255,200,50,0.04)';

function drawMap(){
  const {ox,oy} = mapOffset();
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t = map[r][c];
      const x = ox + c*TILE, y = oy + r*TILE;

      if(t===1){
        // wall
        ctx.fillStyle = WALL_CLR;
        ctx.fillRect(x,y,TILE,TILE);
        ctx.fillStyle = 'rgba(255,200,50,0.06)';
        ctx.fillRect(x,y,TILE,2);
      } else {
        // floor
        ctx.fillStyle = t===4 ? SHADOW_CLR : FLOOR_CLR;
        ctx.fillRect(x,y,TILE,TILE);
        // grid line
        ctx.strokeStyle = GRID_CLR;
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x,y,TILE,TILE);
      }

      // loot
      if(t===2){
        const cx2=x+TILE/2, cy2=y+TILE/2;
        const pulse = 0.8 + 0.2*Math.sin(frameCount*0.08);
        ctx.fillStyle = `rgba(255,200,50,${pulse})`;
        ctx.beginPath();
        ctx.arc(cx2,cy2,7,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='rgba(255,200,50,0.3)';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.arc(cx2,cy2,11,0,Math.PI*2);
        ctx.stroke();
      }

      // exit
      if(t===3){
        const allLoot = lootRemaining===0;
        const col2 = allLoot ? '#00FF88' : 'rgba(0,255,136,0.25)';
        ctx.fillStyle = col2;
        ctx.fillRect(x+4,y+4,TILE-8,TILE-8);
        ctx.strokeStyle = allLoot ? '#00FF88' : 'rgba(0,255,136,0.3)';
        ctx.lineWidth = allLoot ? 2 : 1;
        ctx.strokeRect(x+4,y+4,TILE-8,TILE-8);
        // exit icon
        ctx.fillStyle = allLoot ? '#0a0c10' : 'rgba(0,255,136,0.4)';
        ctx.font = 'bold 14px Rajdhani';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('EXIT',x+TILE/2,y+TILE/2);
      }
    }
  }
}

function drawSmokeClouds(){
  const {ox,oy} = mapOffset();
  for(const s of smokeCloudList){
    const px = ox + s.col*TILE + TILE/2;
    const py = oy + s.row*TILE + TILE/2;
    const a  = Math.min(1, s.life/30) * 0.55;
    const r  = TILE * (1 + (1 - s.life/s.maxLife) * 0.5);
    const g  = ctx.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,`rgba(180,200,220,${a})`);
    g.addColorStop(1,`rgba(180,200,220,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px,py,r,0,Math.PI*2);
    ctx.fill();
  }
}

function drawDecoys(){
  const {ox,oy} = mapOffset();
  for(const d of decoyList){
    const px = ox + d.col*TILE + TILE/2;
    const py = oy + d.row*TILE + TILE/2;
    const pulse = 0.5 + 0.5*Math.sin(frameCount*0.18);
    ctx.fillStyle=`rgba(255,100,50,${0.5+pulse*0.3})`;
    ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,100,50,${0.3+pulse*0.2})`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.stroke();
  }
}

function drawGuardFOV(g){
  const {ox,oy} = mapOffset();
  const gx = ox + g.x;
  const gy = oy + g.y;
  const range = g.fovRange * TILE;
  const half  = g.fovAngle / 2;

  // FOV cone
  ctx.beginPath();
  ctx.moveTo(gx,gy);
  const steps = 20;
  for(let i=0;i<=steps;i++){
    const a = g.angle - half + (g.fovAngle/steps)*i;
    // cast ray — stop at wall
    let dist = range;
    for(let d=1;d<=g.fovRange*2;d++){
      const rx = gx + Math.cos(a)*(d*TILE/2);
      const ry = gy + Math.sin(a)*(d*TILE/2);
      const mc = Math.floor((rx-ox)/TILE);
      const mr = Math.floor((ry-oy)/TILE);
      if(mc<0||mc>=COLS||mr<0||mr>=ROWS||map[mr][mc]===1){
        dist = d*TILE/2;
        break;
      }
    }
    ctx.lineTo(gx+Math.cos(a)*dist, gy+Math.sin(a)*dist);
  }
  ctx.closePath();

  const spotted = g.spotted && !g.frozenTimer;
  const fovColor = g.frozenTimer>0
    ? 'rgba(50,150,255,0.15)'
    : spotted
      ? 'rgba(255,50,50,0.25)'
      : 'rgba(255,200,50,0.10)';
  const fovStroke = g.frozenTimer>0
    ? 'rgba(50,150,255,0.4)'
    : spotted
      ? 'rgba(255,50,50,0.5)'
      : 'rgba(255,200,50,0.2)';

  ctx.fillStyle   = fovColor;
  ctx.fill();
  ctx.strokeStyle = fovStroke;
  ctx.lineWidth   = 1;
  ctx.stroke();
}

function drawGuard(g){
  const {ox,oy} = mapOffset();
  const gx = ox + g.x;
  const gy = oy + g.y;

  // body
  const bodyColor = g.frozenTimer>0
    ? '#3296FF'
    : g.spotted
      ? '#FF3232'
      : '#E05000';

  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.arc(gx,gy,10,0,Math.PI*2);
  ctx.fill();

  // direction indicator
  ctx.strokeStyle = '#fff';
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.beginPath();
  ctx.moveTo(gx,gy);
  ctx.lineTo(gx+Math.cos(g.angle)*14, gy+Math.sin(g.angle)*14);
  ctx.stroke();

  // EMP frozen indicator
  if(g.frozenTimer>0){
    ctx.strokeStyle='rgba(50,150,255,0.6)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(gx,gy,14,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle='#3296FF';
    ctx.font='bold 10px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('EMP',gx,gy-22);
  }

  // alert "!" above guard
  if(g.alertTimer>0){
    const a = Math.min(1,g.alertTimer/10);
    ctx.fillStyle=`rgba(255,50,50,${a})`;
    ctx.font='bold 18px Rajdhani';
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('!',gx,gy-14);
  }
}

function drawPlayer(){
  const {ox,oy} = mapOffset();
  const px = ox + player.x;
  const py = oy + player.y;

  // shadow glow when hidden
  if(player.hidden){
    ctx.fillStyle='rgba(0,255,136,0.08)';
    ctx.beginPath();ctx.arc(px,py,18,0,Math.PI*2);ctx.fill();
  }

  // body
  const pcol = player.hidden ? '#00BB66' : '#00FF88';
  ctx.fillStyle = pcol;
  ctx.beginPath();
  ctx.arc(px,py,9,0,Math.PI*2);
  ctx.fill();

  // highlight
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(px-3,py-3,3,0,Math.PI*2);
  ctx.fill();

  // detected flash
  if(player.detected){
    const a = 0.5+0.5*Math.sin(frameCount*0.3);
    ctx.strokeStyle=`rgba(255,50,50,${a})`;
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(px,py,14,0,Math.PI*2);
    ctx.stroke();
  }
}

function drawParticles(){
  const {ox,oy} = mapOffset();
  for(const p of particles){
    const a = Math.max(0,p.life);
    const r = Math.max(0,p.size*p.life);
    if(r<=0) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle   = p.col;
    ctx.beginPath();
    ctx.arc(ox+p.x, oy+p.y, r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBG(){
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0,0,CW,CH);

  // vignette
  const vg = ctx.createRadialGradient(CW/2,CH/2,CW*0.2,CW/2,CH/2,CW*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,CW,CH);
}

function drawLootCounter(){
  const {ox,oy} = mapOffset();
  ctx.fillStyle = lootRemaining===0 ? '#00FF88' : '#FFC832';
  ctx.font = 'bold 13px Rajdhani';
  ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillText(
    `💰 ${lootCollected}/${lootCollected+lootRemaining}`,
    ox+MAP_W-6, oy+6
  );
}

// ── Spawn loot particle ───────────────────────────────
function spawnLootParticles(col,row){
  for(let i=0;i<16;i++){
    const angle = (Math.PI*2/16)*i;
    particles.push({
      x: col*TILE+TILE/2 + Math.cos(angle)*4,
      y: row*TILE+TILE/2 + Math.sin(angle)*4,
      vx: Math.cos(angle)*2.5,
      vy: Math.sin(angle)*2.5,
      size:4, col:'#FFC832', life:1
    });
  }
}

// ── BFS Pathfinding ───────────────────────────────────
// Returns next {col,row} step from (fc,fr) toward (tc,tr)
// Returns null if no path found
function bfsNextStep(fc, fr, tc, tr){
  if(fc===tc && fr===tr) return null;
  const key = (c,r) => r*COLS+c;
  const visited = new Set();
  const queue   = [{col:fc, row:fr, path:[]}];
  visited.add(key(fc,fr));
  const DIRS = [[0,-1],[0,1],[-1,0],[1,0]];
  while(queue.length){
    const cur = queue.shift();
    for(const [dc,dr] of DIRS){
      const nc = cur.col+dc, nr = cur.row+dr;
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      if(map[nr][nc]===1) continue;
      if(visited.has(key(nc,nr))) continue;
      visited.add(key(nc,nr));
      const newPath = [...cur.path, {col:nc,row:nr}];
      if(nc===tc && nr===tr) return newPath[0]; // first step
      queue.push({col:nc, row:nr, path:newPath});
    }
  }
  return null; // no path
}

// ── Guard AI ──────────────────────────────────────────
function updateGuards(){
  for(const g of guards){
    if(g.frozenTimer>0){ g.frozenTimer--; g.spotted=false; continue; }

    // patrol movement tick
    g.moveTick++;
    if(!g.moving && g.moveTick >= g.moveInterval){
      g.moveTick = 0;
      const target = g.patrolPath[g.patrolIdx];

      if(!target){ g.patrolIdx=0; continue; }

      const atTarget = (g.col===target.col && g.row===target.row);
      if(atTarget){
        // advance to next patrol waypoint
        g.patrolIdx += g.patrolDir;
        if(g.patrolIdx >= g.patrolPath.length){ g.patrolIdx = g.patrolPath.length-2; g.patrolDir=-1; }
        if(g.patrolIdx < 0)                  { g.patrolIdx = 1;                      g.patrolDir= 1; }
      } else {
        // ── BFS: find next step toward patrol target ──
        const step = bfsNextStep(g.col, g.row, target.col, target.row);
        if(step){
          const nc = step.col, nr = step.row;
          g.col = nc; g.row = nr;
          g.moving = true; g.moveT = 0;
          g.targetAngle = Math.atan2(
            (nr*TILE+TILE/2) - g.y,
            (nc*TILE+TILE/2) - g.x
          );
        } else {
          // BFS found no path — skip this waypoint
          g.patrolIdx += g.patrolDir;
          if(g.patrolIdx >= g.patrolPath.length){ g.patrolIdx=0; g.patrolDir=1; }
          if(g.patrolIdx < 0)                  { g.patrolIdx=0; g.patrolDir=1; }
        }
      }
    }

    // smooth pixel movement (lerp toward grid target)
    if(g.moving){
      g.moveT = Math.min(1, g.moveT + 0.13);
      const tx = g.col*TILE+TILE/2;
      const ty = g.row*TILE+TILE/2;
      g.x += (tx - g.x) * 0.18;
      g.y += (ty - g.y) * 0.18;
      if(g.moveT >= 1){ g.moving=false; g.x=tx; g.y=ty; }
    }

    // smooth angle rotation
    let da = g.targetAngle - g.angle;
    while(da >  Math.PI) da -= Math.PI*2;
    while(da < -Math.PI) da += Math.PI*2;
    g.angle += da * 0.14;

    // FOV detection
    g.spotted = false;
    if(!player.hidden && !empActive) detectPlayer(g);

    if(g.alertTimer>0) g.alertTimer--;
  }
}

function detectPlayer(g){
  const dx = player.x - g.x;
  const dy = player.y - g.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist > g.fovRange * TILE) return;

  const angle = Math.atan2(dy,dx);
  let da = angle - g.angle;
  while(da> Math.PI) da-=Math.PI*2;
  while(da<-Math.PI) da+=Math.PI*2;
  if(Math.abs(da) > g.fovAngle/2) return;

  // wall check (simple)
  const steps = Math.ceil(dist/(TILE/2));
  for(let i=1;i<steps;i++){
    const t = i/steps;
    const rx = g.x + dx*t;
    const ry = g.y + dy*t;
    const mc = Math.floor(rx/TILE);
    const mr = Math.floor(ry/TILE);
    if(mc>=0&&mc<COLS&&mr>=0&&mr<ROWS&&map[mr][mc]===1) return;
  }

  // spotted!
  g.spotted = true;
  g.alertTimer = 40;
  g.targetAngle = Math.atan2(dy,dx);

  player.detectedTimer++;
  if(player.detectedTimer > 45){
    triggerCaught();
  }
}

// ── Player movement ───────────────────────────────────
function tryMove(dc, dr){
  if(player.moving || gameState!=='playing') return;
  const nc = player.col + dc;
  const nr = player.row + dr;
  if(nc<0||nc>=COLS||nr<0||nr>=ROWS) return;
  if(map[nr][nc]===1) return;

  player.col = nc;
  player.row = nr;
  player.moving = true;
  player.moving_t = 0;
  player.tx = nc*TILE+TILE/2;
  player.ty = nr*TILE+TILE/2;

  // check tile
  const t = map[nr][nc];
  player.hidden = (t===4) || isInSmoke(nc,nr);

  if(t===2){
    // collect loot
    map[nr][nc]=0;
    lootCollected++;
    lootRemaining--;
    score += 100 + level*10;
    if(score>best){ best=score; localStorage.setItem('shBest',best); }
    spawnLootParticles(nc,nr);
    showFloat('+ 100','#FFC832', nc, nr);
    updateHUD();
  }

  if(t===3 && lootRemaining===0){
    // win!
    setTimeout(()=>triggerWin(),400);
  }
}

function updatePlayer(){
  if(!player.moving) return;
  player.moving_t = Math.min(1, player.moving_t + 0.18);
  player.x += (player.tx - player.x) * 0.25;
  player.y += (player.ty - player.y) * 0.25;
  if(player.moving_t >= 1){
    player.moving = false;
    player.x = player.tx;
    player.y = player.ty;
    player.hidden = (map[player.row][player.col]===4)||isInSmoke(player.col,player.row);
  }

  if(!player.hidden) player.detectedTimer = Math.max(0,player.detectedTimer-1);
  player.detected = player.detectedTimer > 0;
}

// ── Gadget helpers ─────────────────────────────────────
function isInSmoke(col,row){
  return smokeCloudList.some(s=>s.col===col&&s.row===row&&s.life>0);
}

function useSmoke(){
  if(gadgets.smoke<=0) return;
  gadgets.smoke--;
  smokeCloudList.push({col:player.col,row:player.row,life:90,maxLife:90});
  showFloat('SMOKE','#B4C8DC',player.col,player.row);
  updateGadgetUI();
}

function useEMP(){
  if(gadgets.emp<=0) return;
  gadgets.emp--;
  for(const g of guards){ g.frozenTimer=120; g.spotted=false; }
  empActive=true; empTimer=120;
  showFloat('EMP!','#3296FF',player.col,player.row);
  updateGadgetUI();
}

function useDecoy(){
  if(gadgets.decoy<=0) return;
  gadgets.decoy--;

  // Find a nearby walkable tile for decoy (not a wall)
  let fc=player.col, fr=player.row;
  const offsets=[[0,3],[0,-3],[3,0],[-3,0],[2,2],[2,-2],[-2,2],[-2,-2],[0,4],[4,0]];
  for(const [dc,dr] of offsets){
    const nc=player.col+dc, nr=player.row+dr;
    if(nc>=1&&nc<COLS-1&&nr>=1&&nr<ROWS-1&&map[nr][nc]!==1){ fc=nc;fr=nr;break; }
  }

  decoyList.push({col:fc,row:fr,life:150});
  // attract guards — BFS will handle navigation
  for(const g of guards){
    g.patrolPath = [{col:fc,row:fr},{col:g.col,row:g.row}];
    g.patrolIdx  = 0;
    g.patrolDir  = 1;
  }
  showFloat('DECOY','#FF6432',player.col,player.row);
  updateGadgetUI();
}

// ── Update gadget timers ──────────────────────────────
function updateGadgets(){
  smokeCloudList = smokeCloudList.filter(s=>{s.life--;return s.life>0;});
  decoyList      = decoyList.filter(d=>{d.life--;return d.life>0;});
  if(empTimer>0){ empTimer--; if(empTimer<=0) empActive=false; }
  // re-check hidden
  player.hidden = (map[player.row][player.col]===4)||isInSmoke(player.col,player.row);
}

// ── Particles update ──────────────────────────────────
function updateParticles(){
  particles = particles.filter(p=>p.life>0.01);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.025;
  }
}

// ── Alert bar ─────────────────────────────────────────
function showAlert(){
  const el = document.getElementById('alert-bar');
  el.classList.add('show');
  clearTimeout(window._alertTO);
  window._alertTO = setTimeout(()=>el.classList.remove('show'),800);
}

// ── Float text ────────────────────────────────────────
function showFloat(txt,col,gc,gr){
  const {ox,oy} = mapOffset();
  const el = document.createElement('div');
  el.className='float-txt';
  el.textContent=txt;
  el.style.color=col;
  el.style.left=(ox+gc*TILE+TILE/2-30)+'px';
  el.style.top =(oy+gr*TILE-10)+'px';
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

// ── HUD update ────────────────────────────────────────
function updateHUD(){
  document.getElementById('h-level').textContent = String(level).padStart(2,'0');
  document.getElementById('h-score').textContent = score;
  document.getElementById('h-best').textContent  = best;
}

function updateGadgetUI(){
  document.getElementById('g0-count').textContent = gadgets.smoke;
  document.getElementById('g1-count').textContent = gadgets.emp;
  document.getElementById('g2-count').textContent = gadgets.decoy;
  ['g0','g1','g2'].forEach((id,i)=>{
    const el=document.getElementById(id);
    const counts=[gadgets.smoke,gadgets.emp,gadgets.decoy];
    el.classList.toggle('empty',counts[i]<=0);
  });
}

// ── Game over / win ───────────────────────────────────
function triggerCaught(){
  if(gameState==='dead'||gameState==='win') return;
  gameState='dead';
  cancelAnimationFrame(raf);
  showAlert();
  setTimeout(()=>{
    document.getElementById('go-score-val').textContent='Score: '+score;
    const isNew = score>0 && score>=best;
    const bestEl=document.getElementById('go-best-val');
    bestEl.textContent = isNew ? '🏆 New Best: '+best : 'Best: '+best;
    bestEl.className   = 'go-best'+(isNew?' newbest':'');
    document.getElementById('go-screen').style.display='flex';
    // AdMob interstitial hook
    if(typeof showInterstitialAd==='function') showInterstitialAd();
  },600);
}

function triggerWin(){
  if(gameState==='win') return;
  gameState='win';
  cancelAnimationFrame(raf);
  const timeBonus = Math.max(0, 300 - Math.floor(levelTime/60));
  score += timeBonus + 200;
  if(score>best){ best=score; localStorage.setItem('shBest',best); }
  const stars = lootRemaining===0
    ? (levelTime<600?'★★★':(levelTime<1200?'★★☆':'★☆☆'))
    : '☆☆☆';
  document.getElementById('win-stars').textContent=stars;
  document.getElementById('win-score-val').textContent='Score: '+score;
  document.getElementById('win-time-val').textContent='Time: '+Math.floor(levelTime/60)+'s';
  document.getElementById('win-screen').style.display='flex';
}

// ── Main loop ─────────────────────────────────────────
function gameLoop(){
  frameCount++;
  levelTime++;
  CW=canvas.width; CH=canvas.height;

  // check if any guard spotted this frame
  const anySpotted = guards.some(g=>g.spotted);
  if(anySpotted && !player.hidden) showAlert();

  updatePlayer();
  updateGuards();
  updateGadgets();
  updateParticles();

  // draw
  drawBG();
  drawMap();
  drawSmokeClouds();
  drawDecoys();

  // guard FOV under guard body
  for(const g of guards) drawGuardFOV(g);
  for(const g of guards) drawGuard(g);

  drawPlayer();
  drawParticles();
  drawLootCounter();

  if(gameState==='playing') raf=requestAnimationFrame(gameLoop);
}

// ── Init level ────────────────────────────────────────
function initLevel(){
  generateLevel(level);
  spawnGuards(level);
  player.col=1; player.row=1;
  player.x=1*TILE+TILE/2; player.y=1*TILE+TILE/2;
  player.tx=player.x; player.ty=player.y;
  player.moving=false; player.hidden=false;
  player.detected=false; player.detectedTimer=0;
  frameCount=0; levelTime=0;
  smokeCloudList=[]; decoyList=[]; particles=[];
  empActive=false; empTimer=0;
  // gadgets — bonus each level
  gadgets = { smoke:2+Math.floor(level/3), emp:1, decoy:1+Math.floor(level/4) };
  updateHUD();
  updateGadgetUI();
}

// ── Start / Restart / Next ────────────────────────────
function startGame(){
  document.getElementById('start-screen').style.display='none';
  score=0; level=1;
  initLevel();
  gameState='playing';
  cancelAnimationFrame(raf);
  gameLoop();
}

function restartGame(){
  document.getElementById('go-screen').style.display='none';
  score=0; level=1;
  initLevel();
  gameState='playing';
  cancelAnimationFrame(raf);
  gameLoop();
}

function nextLevel(){
  document.getElementById('win-screen').style.display='none';
  level++;
  initLevel();
  gameState='playing';
  cancelAnimationFrame(raf);
  gameLoop();
}

// ── Touch / keyboard input ────────────────────────────
let touchStartX=0, touchStartY=0;

document.addEventListener('touchstart',e=>{
  // check if gadget bar tap
  const t=e.touches[0];
  const g0=document.getElementById('g0').getBoundingClientRect();
  const g1=document.getElementById('g1').getBoundingClientRect();
  const g2=document.getElementById('g2').getBoundingClientRect();

  if(t.clientX>=g0.left&&t.clientX<=g0.right&&t.clientY>=g0.top&&t.clientY<=g0.bottom){ useSmoke(); return; }
  if(t.clientX>=g1.left&&t.clientX<=g1.right&&t.clientY>=g1.top&&t.clientY<=g1.bottom){ useEMP();   return; }
  if(t.clientX>=g2.left&&t.clientX<=g2.right&&t.clientY>=g2.top&&t.clientY<=g2.bottom){ useDecoy(); return; }

  touchStartX=t.clientX; touchStartY=t.clientY;
},{passive:true});

document.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-touchStartX;
  const dy=t.clientY-touchStartY;
  const ab=Math.max(Math.abs(dx),Math.abs(dy));
  if(ab<12) return;
  if(Math.abs(dx)>Math.abs(dy)){ tryMove(dx>0?1:-1,0); }
  else                          { tryMove(0,dy>0?1:-1); }
},{passive:true});

document.addEventListener('keydown',e=>{
  switch(e.code){
    case'ArrowUp':   case'KeyW': e.preventDefault(); tryMove(0,-1); break;
    case'ArrowDown': case'KeyS': e.preventDefault(); tryMove(0, 1); break;
    case'ArrowLeft': case'KeyA': e.preventDefault(); tryMove(-1,0); break;
    case'ArrowRight':case'KeyD': e.preventDefault(); tryMove( 1,0); break;
    case'Digit1': useSmoke(); break;
    case'Digit2': useEMP();   break;
    case'Digit3': useDecoy(); break;
  }
});

// gadget buttons pointer events
document.getElementById('gadget-bar').style.pointerEvents='all';

function shareScore(){
  const txt=`I scored ${score} on Level ${level} in Shadow Heist! Can you beat me? 🕵️`;
  if(navigator.share) navigator.share({title:'Shadow Heist',text:txt}).catch(()=>{});
  else if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('Copied! 📋'));
}

// init best display
document.getElementById('h-best').textContent=best;
</script>
